name: .NET CI

on:
  push:
    branches: [ "Js", "Jace", "Mindy", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.112'

    - name: Restore Dependencies
      run: dotnet restore
      working-directory: ./RestaurantReservationAndOrderManagementSystem

    - name: Build Project
      run: dotnet build --configuration Release --no-restore
      working-directory: ./RestaurantReservationAndOrderManagementSystem

    - name: Publish Artifact
      run: dotnet publish --configuration Release --no-build --output ./publish-output
      working-directory: ./RestaurantReservationAndOrderManagementSystem

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: webapp-artifact
        path: ./RestaurantReservationAndOrderManagementSystem/publish-output